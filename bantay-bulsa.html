 messages:[["Old phone · bank app","Allow a new device to use mobile banking?"],["Request details","Device: your new Luna 8 · Requested just now. Pairing words: Mango Bay. Check these words on your new phone."]],
 hint:"Who started the setup? Compare the words on the two screens before deciding which request belongs to your new phone.",
 question:"How should you finish this setup?",choices:[["Approve the matching request on your old phone, inside the official bank app.","You initiated this setup and matched the two devices before approving."],["Approve every request that arrives during setup.","A second, unrelated request could enroll a device you do not control."],["Message a support page and send both pairing words for confirmation.","You can compare the two screens yourself. An outside party does not need your setup details."]],safe:0,
 lesson:"In this fictional bank, pairing words link the two screens. Real banks use different checks. Approve only the exact action you started and can independently match.",src:["bank","bsp"]
},{
 picture:"seminar", title:"Tita’s investment group",setting:"Your aunt invites you to an investing seminar online. Her first small withdrawal arrived. At the end, a coach offers to help you connect your savings account.",channel:"Video call transcript",sender:"Investment coach",icon:"T",skin:"call",
 messages:[["Coach","The slides promise a fixed 8% every week. There’s a company registration certificate on screen."],["During the call","A screen-sharing request appears. The coach asks you to open online banking while sharing, so they can guide the first deposit."]],
 hint:"Imagine what the coach would see as you signed in. What does your aunt’s first payout tell you about the coach’s right to offer this investment?",
 question:"What do you do before investing?",choices:[["Share your screen but cover your face and the front of your card.","The requested view is of your bank screen. Covering the camera does not protect it."],["Start with a small deposit because a relative already withdrew.","An initial payout cannot prove that an investment is authorized or that future withdrawals will be paid."],["Decline sharing. Check the offer and authority to sell it through independent sources.","Your bank session stays private while you check the claimed firm and investment with the SEC or broker through contacts you find yourself."]],safe:2,
 lesson:"A real company can be impersonated. A certificate and a relative’s payout do not verify the offer or justify watching your banking session. If access was granted, disconnect and call your bank from another trusted device.",src:["invest","bsp","help"]
},{
 picture:"voice", title:"A voice you recognize",setting:"A voice note from a new chat account sounds like your younger sister. She says she’s at a clinic in Cebu. You know she is traveling there. You still have her usual phone number in your contacts.",channel:"Family voice note",sender:"“It’s me, Ate”",icon:"♪",skin:"call",
 messages:[["Voice note · transcript","The speaker asks you to cover a clinic deposit because her phone broke."],["Follow-up","A payment request arrives for ₱6,800 to a person’s name. The chat asks you to approve it before triage."]],
 hint:"If someone had copied your sister’s voice, how could you reach her without using anything the new chat sent?",
 question:"What do you do about the payment request?",choices:[["Pay half so your sister can get seen while you check.","Even half the deposit goes to an unfamiliar person before you know whether your sister needs help."],["Ask the new chat for another voice note before paying.","A second recording from the same source is not an independent check."],["Decline it and warn your sister through her saved number.","Your sister answers from her hotel and says she’s fine. Using her saved number lets you check the story independently."]],safe:2,
 lesson:"An impersonator can use a recording or an imitation. You do not need to identify the technology to act safely. Use a contact you already trust to check an emergency.",src:["family","bsp"]
},{
 picture:"signal", title:"No signal on payday",setting:"Your mobile signal disappears, but home Wi-Fi works. A caller on a chat app offers to restore your number. From another phone, you reach your carrier at its published number. It confirms a replacement SIM you never requested.",channel:"Service notifications",sender:"Your mobile line",icon:"S",skin:"record",
 messages:[["Chat call · transcript","The caller says a tower issue has affected payroll customers and offers a form to restore your SIM."],["Bank notification","A new phone is being registered for mobile banking. You have not changed phones."]],
 hint:"Think about where bank security texts might go after a SIM replacement. Which two providers control different parts of that problem?",
 question:"Which response protects both accounts now?",choices:[["Restart the phone and wait until tomorrow for your signal to return.","The carrier confirmed an unauthorized replacement. Waiting leaves the phone number and bank access exposed."],["Use a trusted phone to ask the carrier to suspend the replacement and the bank to secure your account.","The carrier can protect the number. The bank can restrict access, review device enrollment and check recent activity."],["Change only your bank password and leave the carrier issue until later.","The replacement SIM still controls your number and may receive recovery messages. Both providers need the report."]],safe:1,
 lesson:"Loss of signal has many causes. An unauthorized SIM change together with an unexpected bank enrollment calls for urgent action with both providers through independently obtained contacts.",src:["bsp","bank"]
},{
 picture:"refund", title:"The refund after the refund",setting:"Yesterday you entered your bank password on a fake refund page and read out a one-time password (OTP). You reported it. This morning someone calls with your real complaint number. They tell you to approve the request on your phone to reverse the loss.",channel:"Follow-up call",sender:"“Recovery desk”",icon:"↩",skin:"call",
 messages:[["Caller","They recite the exact disputed amount. They say your refund is approved and ask you to accept a bank request to cancel the loss."],["Bank app prompt","Register a new device for mobile banking? The caller tells you this prompt is part of the reversal."]],
 hint:"Read the bank prompt as if the caller were silent. What would approval actually do, and what did you already share yesterday?",
 question:"What should happen before anything else?",choices:[["Decline enrollment and tell the real bank about the exposed password and OTP immediately.","Ask the bank to restrict access, revoke unfamiliar devices or sessions, review transfers and help secure recovery access."],["Approve the prompt and get the caller’s name for the case file.","The real prompt grants access to a phone. A complaint number or a caller’s name cannot change what it authorizes."],["Decline the prompt, block the caller and wait for the case to close.","Declining helps, but the earlier password and OTP disclosure leaves access at risk. The bank needs that information now."]],safe:0,
 lesson:"Even a genuine bank prompt can authorize the wrong action. From a trusted device, follow the bank’s recovery instructions and change exposed or reused passwords. Save the evidence. A refund is never guaranteed.",src:["rec","calls","help","bank"]
}

const plain = value => String(value).replace(/\s+/gu," ").trim();
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const validName = value => typeof value === "string" && value.length <= 100 && plain(value).split(" ").length >= 2 && plain(value).split(" ").every(p => /^[\p{L}][\p{L}\p{M}.'’\p{Pd}]*$/u.test(p));
const validReason = value => typeof value === "string" && value.length <= 400 && (value.match(/[\p{L}\p{N}]+/gu)||[]).length >= 3 && (value.match(/[\p{L}\p{N}]/gu)||[]).length >= 12;
const index3 = n => Number.isInteger(n) && n >= 0 && n < 3;
const emptyDraft = () => ({pick:null,reason:""});
function stage(i){return i<3?"Everyday messages":i<6?"Check the transaction":i<8?"Someone you trust":"Protect the account";}
function points(i,a){
  if(!a)return 0;
  return a.legacyPoints ?? (a.pick===cases[i].safe?100:0);
}
function total(r){return r.answers.reduce((sum,a,i)=>sum+points(i,a),0);}
function clock(ms){const sec=Math.ceil(Math.max(0,ms)/1000);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}
function newRun(name,now){return {v:2,name:plain(name),start:now,end:null,outcome:"active",feedback:false,answers:[],draft:emptyDraft()};}
function fromSave(raw){
  if(!raw)return null;
  try{
    const r=JSON.parse(raw);
    if(!r || ![1,2].includes(r.v) || !validName(r.name) || !Number.isSafeInteger(r.start) || r.start<=0 || !Array.isArray(r.answers) || r.answers.length>cases.length || typeof r.feedback!=="boolean")return null;
    if(!r.answers.every(a=>a && index3(a.pick) && validReason(a.reason)))return null;
    if(!["active","complete","expired"].includes(r.outcome) || (r.feedback && !r.answers.length))return null;
    if(r.outcome==="active" && (r.end!==null || r.answers.length===cases.length))return null;
    if(r.outcome!=="active" && (!Number.isSafeInteger(r.end) || r.end<r.start || r.end>r.start+LIMIT))return null;
    if((r.outcome==="complete")!==(r.answers.length===cases.length) || (r.outcome==="expired" && r.feedback))return null;
    if(r.v===1){
      // Preserve points earned under the original 80-point move / 20-point clue rules.
      const originalKeys=[[0],[1],[2],[1,2],[1],[1],[0,2],[2],[1,2],[1,2]];
      if(!r.answers.every(a=>index3(a.pin)))return null;
      r.answers=r.answers.map((a,i)=>({
        pick:a.pick,reason:a.reason,
        legacyPoints:(a.pick===cases[i].safe?80:0)+(originalKeys[i].includes(a.pin)?20:0)
      }));
      r.v=2;
    }else if(!r.answers.every((a,i)=>a.legacyPoints===undefined || (a.pick===cases[i].safe?[80,100]:[0,20]).includes(a.legacyPoints)))return null;
    const d=r.draft;
    r.draft=d && (d.pick===null||index3(d.pick)) && typeof d.reason==="string" && d.reason.length<=400
      ? {pick:d.pick,reason:d.reason} : emptyDraft();
    return r;
  }catch{return null;}
}
function noStorage(){storageOK=false;$("#storage-note").hidden=false;}
function readLocal(){try{storedText=localStorage.getItem(SAVE_KEY);run=fromSave(storedText);}catch{noStorage();}}
function reloadProgress(raw){
  storedText=raw;run=fromSave(raw);reportCache=null;screen="welcome";closeTools(false);expire();draw();
}
function persist(){
  if(!storageOK)return true;
  try{
    const current=localStorage.getItem(SAVE_KEY);
    if(current!==storedText){reloadProgress(current);announce("Progress changed in another tab. Use the latest saved run.");return false;}
    const next=run?JSON.stringify(run):null;
    if(next===null)localStorage.removeItem(SAVE_KEY);else localStorage.setItem(SAVE_KEY,next);
    storedText=next;
  }catch{noStorage();}
  return true;
}
function expire(now=Date.now()){
  if(!run||run.outcome!=="active"||now<run.start+LIMIT)return false;
  run.outcome="expired";run.end=run.start+LIMIT;run.feedback=false;run.draft=emptyDraft();screen="results";
  persist();return true;
}

    for(const el of [$("#main"),$(".top")]){el.inert=true;el.setAttribute("aria-hidden","true");}
  }
  $("#picture-close").focus({preventScroll:true});
}
function setPictureZoom(zoom){
  const stage=$("#picture-stage"),button=$("#picture-zoom");
  stage.classList.toggle("enlarged",zoom);
  stage.scrollTop=0;stage.scrollLeft=0;
  button.setAttribute("aria-pressed",String(zoom));button.textContent=zoom?"Fit image":"Zoom in";
  $("#picture-help").textContent=zoom?"Swipe or scroll to see details.":"";
}
function closePicture(restore=true){
  if(!pictureTrigger)return;
  const previous=pictureTrigger;pictureTrigger=null;
  if(document.body.classList.contains("picture-fallback")){
    for(const el of [$("#main"),$(".top")]){el.inert=false;el.removeAttribute("aria-hidden");}
    pictureDialog.removeAttribute("open");
  }else if(pictureDialog.open){pictureDialog.close();}
  document.body.classList.remove("picture-open","picture-fallback");
  $("#picture-full").removeAttribute("src");
  if(restore&&previous.isConnected)previous.focus({preventScroll:true});
}
function renderHint(c){
  return '<details class="case-hint"><summary><span class="show-hint">Show hint</span><span class="hide-hint">Hide hint</span></summary><p>'+escapeHTML(c.hint)+'</p></details>';
}
function renderDecision(c,d){
  return '<form class="paper" id="decision"><fieldset class="choices"><legend class="question">'+escapeHTML(c.question)+'</legend>'+renderHint(c)+c.choices.map(([text],j)=>'<label class="pick"><input type="radio" name="decision" value="'+j+'" '+(d.pick===j?"checked":"")+'><span>'+escapeHTML(text)+'</span></label>').join("")+'</fieldset><label class="field" for="reason">Why this move?</label><textarea class="text" id="reason" maxlength="400" aria-describedby="why-help" placeholder="What did you notice?">'+escapeHTML(d.reason)+'</textarea><p class="hint" id="why-help">Write a short sentence (3 words and 12 letters or numbers). Leave out real banking details.</p><p id="gates" class="hint" aria-live="polite"></p><button id="lock" class="primary full" disabled>Lock in my decision</button></form>';
}
function gates(){
  const d=run.draft, missing=[];
  if(d.pick===null)missing.push("choose a move");
  if(!validReason(d.reason))missing.push("write a reason");
  $("#lock").disabled=missing.length>0;
  const msg=missing.length?"Still to do: "+missing.join(" · ")+".":"Ready to lock in.";
  if($("#gates").textContent!==msg)$("#gates").textContent=msg;
}
function playScreen(){
  const i=run.answers.length,c=cases[i],d=run.draft;
  view.innerHTML=progress(i)+'<div class="casegrid">'+renderStory(c,i)+renderDecision(c,d)+'</div>';
  gates();
}
function feedback(){
  const i=run.answers.length-1,c=cases[i],a=run.answers[i],safe=a.pick===c.safe;
  const carried=a.legacyPoints===undefined?"":'<p class="small">Points carried over from the earlier scoring rules.</p>';
  view.innerHTML=progress(i)+'<div class="casegrid"><section class="paper feedback '+(safe?"":"miss")+'"><div class="eyeline"><span class="kicker">Your decision</span><span class="stamp">+'+points(i,a)+' / 100</span></div><h2 id="feedback-title" tabindex="-1">'+(safe?"You protected the account.":"Here’s where the risk was.")+'</h2><p><strong>'+escapeHTML(c.choices[a.pick][0])+'</strong></p><p>'+escapeHTML(c.choices[a.pick][1])+'</p>'+(safe?'':'<p><strong>Safest move</strong><br>'+escapeHTML(c.choices[c.safe][0])+'</p>')+carried+'<hr><p>'+escapeHTML(c.lesson)+'</p>'+button("next",i===cases.length-1?"View my debrief":"Next case →","primary full")+'</section>'+renderStory(c,i)+'</div>';
}
function results(){
  const n=run.answers.length,safe=run.answers.filter((a,i)=>a.pick===cases[i].safe).length;
  view.innerHTML='<div class="casegrid"><section class="panel"><span class="kicker">'+(run.outcome==="expired"?"Time is up":"Activity complete")+'</span><h1 tabindex="-1" id="results-title">Your debrief</h1><p>'+escapeHTML(run.name)+'</p><div class="num">'+total(run)+'<small> / 1,000</small></div><p><strong>'+safe+' / 10</strong> safest moves<br>'+n+' answered · '+clock(run.end-run.start)+' used</p>'+(run.answers.some(a=>a.legacyPoints!==undefined)?'<p class="small">Scores earned before the hint update carry over.</p>':'')+(n<10?'<p class="alert">The '+(10-n)+' unanswered '+(n===9?"case earned":"cases earned")+' zero points.</p>':'')+'<div class="btnrow">'+button("save","Save my debrief","primary")+button("restart","Play again")+'</div></section><section class="panel"><h2>Case notes</h2><p class="tip">Open a case to review your decision.</p>'+cases.map((c,i)=>{
    const a=run.answers[i];
    return '<details class="review"><summary><span>'+escapeHTML(c.title)+'</span><span>'+points(i,a)+'/100</span></summary>'+(a?'<p><b>Your move</b><br>'+escapeHTML(c.choices[a.pick][0])+'</p><p><b>Your reason</b><br>'+escapeHTML(a.reason)+'</p>':'<p>Unanswered before time expired.</p>')+'<p><b>Safest move</b><br>'+escapeHTML(c.choices[c.safe][0])+'</p><p>'+escapeHTML(c.lesson)+'</p><p class="small">Sources · '+c.src.map(id=>escapeHTML(references[id][0])).join(", ")+'</p></details>';
  }).join("")+'</section></div>'+footer();
}
function draw(focus=false){
  closePicture(false);
  if(!run||screen==="welcome")welcome();
  else if(screen==="results")results();
  else if(run.feedback)feedback();
  else if(run.outcome!=="active"){screen="results";results();}
  else playScreen();
  view.querySelectorAll("img[data-thumb]").forEach(img=>{img.src=pictures[img.dataset.thumb].data;});
  if(focus&&!tool)topFocus(screen==="welcome"?"#title":screen==="results"?"#results-title":run.feedback?"#feedback-title":"#case-title");
}
function afterChange(focus=true){if(persist())draw(focus);}
function tick(){
  if(expire()){closeTools(false);draw(true);return;}
  const el=$("#clock");if(el&&run)el.textContent=clock(run.start+LIMIT-(run.end||Date.now()));
}
function lock(){
  if(!run||screen!=="game"||run.feedback||run.outcome!=="active")return;
  if(expire()){draw(true);return;}
  const d=run.draft;
  if(!index3(d.pick)||!validReason(d.reason))return;
  run.answers.push({pick:d.pick,reason:plain(d.reason)});run.draft=emptyDraft();run.feedback=true;
  if(run.answers.length===cases.length){run.outcome="complete";run.end=Math.min(Date.now(),run.start+LIMIT);}
  afterChange();
}
function toolPage(id,title,html){
  if(!tool)returnFocus=document.activeElement;
  tool=id;view.hidden=true;box.hidden=false;$("#help-toggle").setAttribute("aria-expanded","true");
  box.innerHTML='<h2 tabindex="-1" id="tool-title">'+escapeHTML(title)+'</h2>'+html+'<div class="footer">'+button("close","Back to game","secondary")+'</div>';
  topFocus("#tool-title");
}
function closeTools(restore=true){
  tool="";box.hidden=true;view.hidden=false;box.replaceChildren();$("#help-toggle").setAttribute("aria-expanded","false");checking++;
  if(restore){const el=returnFocus?.isConnected?returnFocus:$("#help-toggle");el.focus();}
  returnFocus=null;
}
function pictureCredits(){
  return '<h3>Picture credits</h3><p>The ten phone screens are fictional training examples. The casino graphic includes a cropped, tinted photograph. The bakery notification uses a cropped photograph of pandesal.</p><ul class="source-list"><li><b>Pile of Poker Chips</b> · Julian Lupyan · CC0 1.0<br><code>https://commons.wikimedia.org/wiki/File:Pile_of_Poker_Chips.jpg</code></li><li><b>Fresh baked Pandesal</b> · Drallenphoto · CC0 1.0<br><code>https://commons.wikimedia.org/wiki/File:Fresh_baked_Pandesal.jpg</code></li></ul>';
}
function sources(){
  toolPage("sources","Research sources",'<p>These consumer advisories informed the fictional cases. Titles and addresses are included for later reference.</p><ul class="source-list">'+Object.values(references).map(([org,title,url])=>'<li><b>'+escapeHTML(org)+'</b><br>'+escapeHTML(title)+'<br><code>'+escapeHTML(url)+'</code></li>').join("")+'</ul>'+pictureCredits());
}
function toolsMenu(){
  toolPage("menu","Game tools",'<p>Choose a move and explain what you noticed. Tap Show hint whenever you need a pointer. Each safe move earns 100 points, including when you use a hint.</p><div class="btnrow">'+button("verify","Verify a .txt")+button("sources","Research sources")+(run?button("restart","Start over"):"")+'</div><p class="small">For a real account concern, contact your bank using the number on your card or its official app. This game never asks for account details.</p>');
}
function reportBody(r){
  const lines=["BANTAY BULSA | PARTICIPANT DEBRIEF","Format: 2","Participant: "+r.name,"Started (UTC): "+new Date(r.start).toISOString(),"Finished (UTC): "+new Date(r.end).toISOString(),"Outcome: "+r.outcome,"Time used: "+clock(r.end-r.start)+" / 30:00","Answered: "+r.answers.length+" / 10","Score: "+total(r)+" / 1000","Scoring: 100 for each safest move. Hints are free."];
  if(r.answers.some(a=>a.legacyPoints!==undefined))lines.push("Scores earned before the hint update carry over. Those cases are marked below.");
  lines.push("");
  cases.forEach((c,i)=>{
    const a=r.answers[i];lines.push((i+1)+". "+c.title+" | "+points(i,a)+"/100"+(a?.legacyPoints!==undefined?" (previous scoring)":""));
    if(a)lines.push("Your move: "+c.choices[a.pick][0],"Your reason: "+plain(a.reason));
    else lines.push("Unanswered.");
    lines.push("Safest move: "+c.choices[c.safe][0],"Lesson: "+c.lesson,"");
  });return lines.join("\n").trimEnd();
}
function debriefName(r){return "Bantay_Bulsa_"+plain(r.name).replace(/\s+/gu,"_")+"_Debrief.txt";}
function encode64(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes)));}
function publicKey(){return {kty:gameKey.kty,crv:gameKey.crv,x:gameKey.x,y:gameKey.y};}
async function signBody(body){
  if(!globalThis.crypto?.subtle)throw Error("Report signing is unavailable in this viewer.");
  const key=await crypto.subtle.importKey("jwk",gameKey,{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);
  const sig=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},key,new TextEncoder().encode(body));
  return body+REPORT_MARK+encode64(sig)+"\n";
}
async function verifyText(text){
  const normalized=text.replace(/\r\n/g,"\n"),at=normalized.lastIndexOf(REPORT_MARK);
  if(at<0||!/^BANTAY BULSA \| PARTICIPANT DEBRIEF\nFormat: [12]\n/.test(normalized))throw Error("This file does not contain a signed Bantay Bulsa debrief.");
  const code=normalized.slice(at+REPORT_MARK.length).replace(/\n$/,"");
  if(!/^[A-Za-z0-9+/]{86}==$/.test(code))throw Error("The signature is incomplete or has been changed.");
  if(!globalThis.crypto?.subtle)throw Error("Open this game in a browser that supports Web Crypto to verify a report.");
  const key=await crypto.subtle.importKey("jwk",publicKey(),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
  const body=normalized.slice(0,at), sig=Uint8Array.from(atob(code),c=>c.charCodeAt(0));
  if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,sig,new TextEncoder().encode(body)))throw Error("Verification failed. The text or signature has changed.");
  return body.split("\n").filter(l=>/^(Participant|Score|Answered): /.test(l)).join(" · ");
}
async function savePage(){
  if(!run||run.outcome==="active")return;
  const current=run,body=reportBody(current);toolPage("save","Save your debrief",'<p role="status">Preparing file…</p>');
  if(!reportCache||reportCache.body!==body){
    let signed=true,txt;
    try{txt=await signBody(body);}catch{signed=false;txt=body+"\n\nUNSIGNED COPY — no verification signature available in this viewer.\n";}
    if(run!==current||tool!=="save")return;
    const name=debriefName(current),blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
    let file=null;try{file=new File([blob],name,{type:"text/plain"});}catch{}
    reportCache={body,txt,name,blob,file,signed};
  }
  const r=reportCache;let share=false;try{share=!!(r.file&&navigator.canShare?.({files:[r.file]})&&navigator.share);}catch{}
  toolPage("save","Save your debrief",'<p>'+escapeHTML(r.name)+'</p>'+(r.signed?'':'<p class="alert">This viewer cannot sign the report. You can save an unsigned copy for reflection.</p>')+'<div class="btnrow">'+button("download","Download .txt","primary")+(share?button("share","Share or Save to Files"):"")+'</div><details class="section"><summary>Show text for manual saving</summary><p class="small">If downloads are blocked, copy all the text below and save it as a .txt file.</p><textarea class="text" aria-label="Complete debrief text" readonly>'+escapeHTML(r.txt)+'</textarea></details><p id="file-status" class="small" role="status"></p>');
}
function verifyPage(){toolPage("verify","Verify a debrief",'<p>Select a Bantay Bulsa .txt file. It is checked on this device.</p><label class="field" for="verification">Debrief file</label><input type="file" id="verification" accept=".txt,text/plain"><p role="status" id="verified"></p><p class="small">A valid signature checks the exported text for edits. The standalone game includes its signing key, so it cannot certify identity or prevent someone from creating a new signed report.</p>');}
async function checkFile(file){
  if(!file)return;const id=++checking,target=$("#verified");target.textContent="Checking…";
  try{
    if(!/\.txt$/i.test(file.name)||file.size>200000)throw Error("Choose a .txt report smaller than 200 KB.");
    const info=await verifyText(await file.text());
    if(id===checking)target.textContent="Signature valid. "+info;
  }catch(err){if(id===checking)target.textContent=err.message||"Could not verify this file.";}
}
function handleCmd(cmd){
  if(expire()){closeTools(false);draw(true);return;}
  switch(cmd){
    case "resume": if(!run)break;screen=run.outcome==="active"?"game":"results";draw(true);break;
    case "next": if(!run?.feedback)break;run.feedback=false;screen=run.outcome==="active"?"game":"results";afterChange();break;
    case "restart":toolPage("restart","Start a new game?",'<p>This replaces the saved run on this device. Save a completed debrief first if you want to keep it.</p><div class="btnrow">'+button("confirm-restart","Start over","primary")+'</div>');break;
    case "confirm-restart":if(tool!=="restart")break;run=null;reportCache=null;screen="welcome";closeTools(false);afterChange();break;
    case "close":closeTools();break;
    case "sources":sources();break;
    case "verify":verifyPage();break;
    case "save":savePage();break;
    case "download":{
      if(!reportCache||tool!=="save")break;
      const url=URL.createObjectURL(reportCache.blob),a=document.createElement("a");
      a.href=url;a.download=reportCache.name;document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);$("#file-status").textContent="Download requested. Check your downloads or use the text below.";break;
    }
    case "share":if(reportCache?.file&&tool==="save")navigator.share({files:[reportCache.file]}).catch(err=>{const el=$("#file-status");if(el&&err.name!=="AbortError")el.textContent="Sharing is unavailable. Use Download or copy the text.";});break;
  }
}
document.addEventListener("click",e=>{
  if(e.target===pictureDialog){
    const rect=pictureDialog.getBoundingClientRect();
    if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closePicture();
    return;
  }
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="picture-close"){closePicture();return;}
  if(b.id==="picture-zoom"){setPictureZoom(b.getAttribute("aria-pressed")!=="true");return;}
  if(b.dataset.viewPicture){if(expire()){closeTools(false);draw(true);}else showPicture(b);return;}
  if(b.id==="help-toggle"){if(tool)closeTools();else toolsMenu();return;}
  if(b.dataset.cmd){handleCmd(b.dataset.cmd);return;}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="entry" && !run && validName($("#player").value)){
    run=newRun($("#player").value,Date.now());screen="game";afterChange();
  }else if(e.target.id==="decision")lock();
});
document.addEventListener("input",e=>{
  if(e.target.id==="player"){
    const good=validName(e.target.value);$("#play").disabled=!good;
    $("#name-hint").textContent=good?"This name will appear on your debrief.":"Enter your first and last name.";
  }
  if(e.target.id==="reason"&&run&&!run.feedback&&run.outcome==="active"){
    run.draft.reason=e.target.value;if(persist())gates();
  }
});
document.addEventListener("change",e=>{
  if(e.target.name==="decision"&&run&&!run.feedback&&run.outcome==="active"){run.draft.pick=Number(e.target.value);if(persist())gates();}
  if(e.target.id==="verification")checkFile(e.target.files[0]);
});
document.addEventListener("cancel",e=>{if(e.target===pictureDialog){e.preventDefault();closePicture();}},true);
document.addEventListener("keydown",e=>{
  if(pictureTrigger){
    if(e.key==="Escape"){e.preventDefault();closePicture();}
    if(e.key==="Tab"&&document.body.classList.contains("picture-fallback")){
      const first=$("#picture-close"),last=$("#picture-zoom");
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
    return;
  }
  if(e.key==="Escape"&&tool)closeTools();
});
window.addEventListener("storage",e=>{if(e.key===SAVE_KEY||e.key===null){try{reloadProgress(localStorage.getItem(SAVE_KEY));}catch{noStorage();}}});
window.addEventListener("pageshow",tick);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});
readLocal();expire();draw();setInterval(tick,1000);
</script>
</body>
</html>
